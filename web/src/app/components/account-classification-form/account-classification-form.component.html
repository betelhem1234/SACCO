<div>
  <div class="px-6 py-5 flex items-center gap-3" style="background:linear-gradient(135deg,#6d28d9,#8b5cf6)">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(255,255,255,0.15)">
      <span class="material-icons text-white" style="font-size:20px">category</span>
    </div>
    <div>
      <h2 class="text-white font-bold text-base m-0">{{ editMode ? 'Edit Account Classification' : 'Register New Account Classification' }}</h2>
      <p class="text-xs m-0" style="color:#ddd6fe">Fill in details below</p>
    </div>
  </div>
  <mat-dialog-content class="px-6 py-5">
    <form [formGroup]="form" class="flex flex-col gap-3">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required />
        <mat-icon matPrefix class="mr-2" style="color:#94a3b8">label</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Account Type</mat-label>
        <mat-select formControlName="accountType" required>
          <mat-option *ngFor="let opt of accountTypeOptions" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
        <mat-icon matPrefix class="mr-2" style="color:#94a3b8">account_tree</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" />
        <mat-icon matPrefix class="mr-2" style="color:#94a3b8">description</mat-icon>
      </mat-form-field>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="px-6 py-4" style="border-top:1px solid #e2e8f0">
    <button mat-button (click)="onCancel()" style="color:#64748b;font-weight:500">Cancel</button>
    <button [disabled]="!form.valid" (click)="submit()"
            class="px-5 py-2 rounded-xl text-sm font-semibold border-0 cursor-pointer ml-2 transition-all"
            style="background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:white;box-shadow:0 4px 12px rgba(109,40,217,0.3)">
      {{ editMode ? 'Update Classification' : 'Save Classification' }}
    </button>
  </mat-dialog-actions>
</div>
