services:
  db:
    container_name: sacco-db
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ngrx
      POSTGRES_PASSWORD: password
    volumes:
      - sacco-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ngrx"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: sacco-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ngrx
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    networks:
      - app-network
      - dev-gateway

  web:
    container_name: sacco-web
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    networks:
      - app-network
      - dev-gateway

volumes:
  sacco-db-data:

networks:
  app-network:
    driver: bridge
  dev-gateway:
    external: true
