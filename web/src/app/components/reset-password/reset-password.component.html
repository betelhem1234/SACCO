    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Create a new strong password.</p>
        
        <div *ngIf="message" class="message success">{{ message }}</div>
        <div *ngIf="error" class="message error">{{ error }}</div>

        <form (ngSubmit)="onSubmit()" *ngIf="!success">
          <div class="form-group">
            <label for="password" class="form-label">New Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              [(ngModel)]="password" 
              name="password"
              placeholder="••••••••" 
              required
            >
          </div>
          <button type="submit" class="btn-primary" [disabled]="!password || loading">
            <span *ngIf="loading">Resetting...</span>
            <span *ngIf="!loading">Reset Password</span>
          </button>
        </form>

        <div class="links" *ngIf="success">
          <a routerLink="/login">Proceed to Sign In</a>
        </div>
      </div>
    </div>
