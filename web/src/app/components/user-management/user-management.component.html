    <div class="management-container">
      <div class="header flex justify-between items-center">
        <div>
          <h1>User Access Management</h1>
          <p>Manage roles, locking status, and system access.</p>
        </div>
        <button mat-raised-button color="primary" (click)="toggleForm()" style="background-color: #10b981; color: white;">
          {{ showAddForm ? 'Cancel' : '+ Add New User' }}
        </button>
      </div>

      <!-- Add / Edit User Form -->
      <div *ngIf="showAddForm" class="add-user-card mb-6 p-6 bg-white rounded-xl shadow">
        <h3 class="text-lg font-bold text-gray-800 mb-4">{{ editUserId ? 'Edit System User' : 'Register New System User' }}</h3>
        <form [formGroup]="userForm" (ngSubmit)="saveUser()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="form-group flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1">Full Name</label>
            <input formControlName="fullName" type="text" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="John Doe">
          </div>
          <div class="form-group flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input formControlName="email" type="email" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="john@company.com">
          </div>
          <div class="form-group flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1">Username</label>
            <input formControlName="username" type="text" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="johndoe">
          </div>
          <div class="form-group flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1">System Role</label>
            <select formControlName="roleType" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="ACCOUNTANT">Accountant</option>
              <option value="CASHIER">Cashier</option>
              <option value="AUDITOR">Auditor</option>
              <option value="MANAGER">Manager</option>
              <option value="SUPER_ADMIN">Super Administrator</option>
            </select>
          </div>
          <div class="form-group flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1">Account Status</label>
            <select formControlName="status" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="ACTIVE">Active</option>
              <option value="SUSPENDED">Suspended</option>
              <option value="LOCKED">Locked</option>
            </select>
          </div>
          <div class="form-group flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1">Password {{ editUserId ? '(Leave blank to keep current)' : '' }}</label>
            <input formControlName="password" type="password" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="••••••••">
          </div>
          <div class="md:col-span-2 flex justify-end mt-2">
            <button type="submit" [disabled]="userForm.invalid" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold rounded-lg transition-colors">
              Save User
            </button>
          </div>
        </form>
      </div>

      <div class="mat-elevation-z8 table-container">
        <table mat-table [dataSource]="users">
          
          <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.fullName}} </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let element"> {{element.email}} </td>
          </ng-container>

          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Role </th>
            <td mat-cell *matCellDef="let element"> 
              <span class="role-badge">{{element.role?.name || 'USER'}}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element"> 
              <span class="status-badge" [ngClass]="element.status?.toLowerCase() || 'active'">{{element.status || 'ACTIVE'}}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="primary" (click)="editUser(element)" title="Edit User">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteUser(element.id)" title="Delete User">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
