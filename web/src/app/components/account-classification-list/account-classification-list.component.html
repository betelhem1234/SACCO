<section class="p-6" style="background:#f0f4f8;min-height:100%">
  <div class="max-w-full mx-auto">
    <div class="flex flex-wrap justify-between items-center gap-2 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9)">
          <span class="material-icons text-white" style="font-size:20px">category</span>
        </div>
        <div>
          <h1 class="text-xl font-bold" style="color:#1e293b">Account Classifications</h1>
          <p class="text-xs" style="color:#64748b">Manage account classification definitions</p>
        </div>
      </div>
      <button (click)="onAdd()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border-0 cursor-pointer text-white" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9)">
        <span class="material-icons" style="font-size:18px">add</span> Add Classification
      </button>
    </div>

    <div class="bg-white rounded-2xl overflow-x-auto md:overflow-x-visible shadow-sm border" style="border-color:#e2e8f0">
      <table mat-table [dataSource]="dataSource" class="w-full">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="pl-6">Name</th>
          <td mat-cell *matCellDef="let item" class="pl-6 font-medium">{{ item.name }}</td>
        </ng-container>
        <ng-container matColumnDef="accountType">
          <th mat-header-cell *matHeaderCellDef>Account Type</th>
          <td mat-cell *matCellDef="let item">
            <span class="text-xs font-mono px-2 py-0.5 rounded" style="background:#f1f5f9;color:#475569">
              {{ accountTypeLabel(item.accountType) }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let item">{{ item.description }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-right pr-6">Actions</th>
          <td mat-cell *matCellDef="let item" class="text-right pr-6 gap-1">
            <button mat-icon-button matTooltip="View" (click)="onView(item)" class="!w-8 !h-8" style="color:#059669">
              <span class="material-icons" style="font-size:18px">visibility</span>
            </button>
            <button mat-icon-button matTooltip="Edit" (click)="onEdit(item)" class="!w-8 !h-8" style="color:#1e3a5f">
              <span class="material-icons" style="font-size:18px">edit</span>
            </button>
            <button mat-icon-button matTooltip="Delete" (click)="onDelete(item)" class="!w-8 !h-8" style="color:#ef4444">
              <span class="material-icons" style="font-size:18px">delete_outline</span>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons
                     [pageSize]="10" [length]="dataSource.data.length"
                     [style.display]="dataSource.data.length > 0 ? '' : 'none'">
      </mat-paginator>
      <div *ngIf="dataSource.data.length === 0" class="flex flex-col items-center justify-center py-16 text-center">
        <p class="font-medium" style="color:#64748b">No account classifications registered yet</p>
      </div>
    </div>
  </div>
</section>
