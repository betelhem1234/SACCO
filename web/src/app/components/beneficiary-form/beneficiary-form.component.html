    <div>
      <div class="px-6 py-5 flex items-center gap-3" style="background:linear-gradient(135deg,#1e3a5f,#2d5282)">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(255,255,255,0.15)">
          <span class="material-icons text-white" style="font-size:20px">favorite</span>
        </div>
        <div>
          <h2 class="text-white font-bold text-base m-0">{{ editMode ? 'Edit Beneficiary' : 'Add Beneficiary' }}</h2>
          <p class="text-xs m-0" style="color:#93c5fd">Fill in beneficiary details</p>
        </div>
      </div>
      <mat-dialog-content class="px-6 py-5">
        <form [formGroup]="form" class="flex flex-col gap-4">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Full Name *</mat-label>
            <input matInput formControlName="name" required />
          </mat-form-field>

          <div class="flex gap-4">
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Gender *</mat-label>
              <mat-select formControlName="is_male" required>
                <mat-option [value]="true">Male</mat-option>
                <mat-option [value]="false">Female</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Relation Type *</mat-label>
              <mat-select formControlName="relation_type" required>
                <mat-option [value]="1">Spouse</mat-option>
                <mat-option [value]="2">Child</mat-option>
                <mat-option [value]="3">Parent</mat-option>
                <mat-option [value]="4">Sibling</mat-option>
                <mat-option [value]="5">Other</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Birth Date</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="birth_date" />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <p class="font-semibold text-sm mt-2 mb-1" style="color:#475569">Address</p>
          <div class="flex gap-4">
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Region</mat-label>
              <mat-select formControlName="state_id">
                <mat-option value="">Select</mat-option>
                <mat-option *ngFor="let r of regions" [value]="r.id">{{ r.name }}</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Subcity</mat-label>
              <mat-select formControlName="subcity">
                <mat-option value="">Select</mat-option>
                <mat-option *ngFor="let s of filteredSubcities()" [value]="s.id">{{ s.name }}</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Woreda</mat-label>
              <input matInput formControlName="woreda" />
            </mat-form-field>
          </div>
          <div class="flex gap-4">
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>House No</mat-label>
              <input matInput formControlName="house_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Kebele</mat-label>
              <input matInput formControlName="kebele" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Telephone</mat-label>
              <input matInput formControlName="telephone" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Remark</mat-label>
            <textarea matInput formControlName="remark" rows="2"></textarea>
          </mat-form-field>
        </form>
      </mat-dialog-content>
      <mat-dialog-actions align="end" class="px-6 py-4" style="border-top:1px solid #e2e8f0">
        <button mat-button (click)="onCancel()" style="color:#64748b;font-weight:500">Cancel</button>
        <button [disabled]="!form.valid" (click)="submit()"
                class="px-5 py-2 rounded-xl text-sm font-semibold border-0 cursor-pointer ml-2 transition-all"
                style="background:linear-gradient(135deg,#1e3a5f,#2d5282);color:white;box-shadow:0 4px 12px rgba(30,58,95,0.3)">
          {{ editMode ? 'Update' : 'Add Beneficiary' }}
        </button>
      </mat-dialog-actions>
    </div>
