spring.application.name=api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ngrx}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Disable H2 console as we are using PostgreSQL
spring.h2.console.enabled=false

# JWT (secret comes from APP_JWT_SECRET; dev fallback keeps local tokens stable)
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}
