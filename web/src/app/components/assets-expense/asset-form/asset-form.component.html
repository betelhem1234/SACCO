<div>
  <div class="px-6 py-5 flex items-center gap-3" style="background:linear-gradient(135deg,#1e3a5f,#2d5282)">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(255,255,255,0.15)">
      <span class="material-icons text-white" style="font-size:20px">inventory_2</span>
    </div>
    <div>
      <h2 class="text-white font-bold text-base m-0">{{ editMode ? 'Edit Asset' : 'Register Fixed Asset' }}</h2>
      <p class="text-xs m-0" style="color:#93c5fd">Capitalized equipment purchased for the SACCO</p>
    </div>
  </div>
  <mat-dialog-content class="px-6 py-5">
    <form [formGroup]="form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <mat-form-field appearance="outline" class="w-full col-span-2">
        <mat-label>Asset Name</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Category</mat-label>
        <input matInput formControlName="category" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Purchase Date</mat-label>
        <input matInput formControlName="purchaseDate" type="date" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Cost (ETB)</mat-label>
        <input matInput formControlName="cost" type="number" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Supplier</mat-label>
        <input matInput formControlName="supplier" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Useful Life (years)</mat-label>
        <input matInput formControlName="usefulLifeYears" type="number" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Salvage Value</mat-label>
        <input matInput formControlName="salvageValue" type="number" />
      </mat-form-field>
      <mat-checkbox formControlName="depreciable" class="col-span-1 sm:col-span-2" style="font-weight:500">
        Do not depreciate (consumable / low value)
      </mat-checkbox>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="px-6 py-4" style="border-top:1px solid #e2e8f0;margin-top:auto">
    <button mat-button (click)="onCancel()" style="color:#64748b;font-weight:500">Cancel</button>
    <button [disabled]="!form.valid" (click)="submit()"
            class="px-5 py-2 rounded-xl text-sm font-semibold border-0 cursor-pointer ml-2 transition-all"
            style="background:linear-gradient(135deg,#1e3a5f,#2d5282);color:white;box-shadow:0 4px 12px rgba(30,58,95,0.3)">
      {{ editMode ? 'Update Asset' : 'Save Asset' }}
    </button>
  </mat-dialog-actions>
</div>
